<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Export this chat</title>
  <style>
    :root {
      --paper: #f4f6f6;
      --card: #ffffff;
      --ink: #16191b;
      --muted: #69737a;
      --rule: #dde3e5;
      --pine: #2c6b67;
      --clay: #8a4b39;
      --sel: #2c6b67;
      --sel-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #15181a;
        --card: #1d2225;
        --ink: #e8ecee;
        --muted: #8e989e;
        --rule: #2a3134;
        --pine: #7cc5bc;
        --clay: #d9947c;
        --sel: #7cc5bc;
        --sel-ink: #14191a;
      }
    }

    * { box-sizing: border-box; }

    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      background: var(--paper);
      color: var(--ink);
      font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .eyebrow {
      font: 500 10px/1 ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    header { margin-bottom: 14px; }
    .count { display: flex; align-items: baseline; gap: 7px; margin-top: 7px; }
    .count b {
      font: 500 27px/1 ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
      letter-spacing: -.02em;
      color: var(--pine);
      font-variant-numeric: tabular-nums;
    }
    #title {
      margin: 7px 0 0;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .field { margin-bottom: 12px; }
    .field > .eyebrow { display: block; margin-bottom: 7px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button.fmt {
      font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: left;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 5px;
      padding: 10px 11px;
      cursor: pointer;
    }
    button.fmt small {
      display: block;
      margin-top: 5px;
      font: 400 10px/1.3 ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
      color: var(--muted);
      letter-spacing: .05em;
    }
    button.fmt:hover:not([disabled]) { border-color: var(--pine); }
    button.fmt:focus-visible { outline: 2px solid var(--pine); outline-offset: 1px; }
    button[disabled] { opacity: .45; cursor: default; }

    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
    .seg button {
      font: 500 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--rule);
      border-right-width: 0;
      padding: 8px 0;
      cursor: pointer;
    }
    .seg button:first-child { border-radius: 5px 0 0 5px; }
    .seg button:last-child { border-radius: 0 5px 5px 0; border-right-width: 1px; }
    .seg button[aria-pressed="true"] {
      background: var(--sel);
      border-color: var(--sel);
      color: var(--sel-ink);
    }
    .seg button:focus-visible { outline: 2px solid var(--pine); outline-offset: -2px; }

    .type-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    select#font {
      font: 500 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 5px;
      padding: 8px 7px;
      cursor: pointer;
    }
    select#font:focus-visible { outline: 2px solid var(--pine); outline-offset: -1px; }
    .step {
      display: grid;
      grid-template-columns: 30px 34px 30px;
      align-items: stretch;
      border: 1px solid var(--rule);
      border-radius: 5px;
      overflow: hidden;
      background: var(--card);
    }
    .step button {
      font: 500 14px/1 system-ui, sans-serif;
      color: var(--ink);
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .step button:hover { background: var(--paper); }
    .step button:focus-visible { outline: 2px solid var(--pine); outline-offset: -2px; }
    .step output {
      display: flex; align-items: center; justify-content: center;
      font: 500 12px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      color: var(--muted);
      border-left: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
    }

    label.opt {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      cursor: pointer;
    }
    label.opt input { margin: 1px 0 0; accent-color: var(--pine); flex: none; }

    #status {
      margin: 12px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--rule);
      min-height: 2.4em;
      font: 400 11px/1.5 ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    #status.bad { color: var(--clay); }
    #status.good { color: var(--pine); }
  </style>
</head>
<body>
  <header>
    <span class="eyebrow">Local export</span>
    <div class="count"><b id="loaded">&ndash;</b><span class="eyebrow">messages in view</span></div>
    <p id="title">Checking this tab&hellip;</p>
  </header>

  <div class="field">
    <span class="eyebrow">Format</span>
    <div class="grid">
      <button class="fmt" data-format="markdown" disabled>Markdown<small>.md</small></button>
      <button class="fmt" data-format="pdf" disabled>PDF<small>print view</small></button>
      <button class="fmt" data-format="html" disabled>HTML<small>.html</small></button>
      <button class="fmt" data-format="json" disabled>JSON<small>.json</small></button>
    </div>
  </div>

  <div class="field">
    <span class="eyebrow">Paper</span>
    <div class="seg" id="theme">
      <button data-theme="auto" aria-pressed="true">Auto</button>
      <button data-theme="light" aria-pressed="false">Light</button>
      <button data-theme="dark" aria-pressed="false">Dark</button>
    </div>
  </div>

  <div class="field">
    <span class="eyebrow">Type &mdash; PDF and HTML only</span>
    <div class="type-row">
      <select id="font" aria-label="Typeface"></select>
      <span class="step">
        <button id="minus" type="button" aria-label="Smaller text">&minus;</button>
        <output id="size">16</output>
        <button id="plus" type="button" aria-label="Larger text">+</button>
      </span>
    </div>
  </div>

  <label class="opt">
    <input type="checkbox" id="loadAll" checked>
    Scroll back first to pull in older messages
  </label>

  <p id="status">Everything runs in this browser.</p>

  <script src="doc.js"></script>
  <script src="popup.js"></script>
</body>
</html>
