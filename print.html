<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Transcript</title>
  <script src="doc.js"></script>
  <style id="doc-css"></style>
  <style>
    .bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: .6rem;
      align-items: center;
      background: var(--ink);
      color: var(--paper);
      padding: .55rem .9rem;
      margin: -3.5rem -1.5rem 2.5rem;
      font: 500 12.5px/1 ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    .bar button {
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 0;
      border-radius: 4px;
      padding: .5rem .85rem;
      cursor: pointer;
    }
    .bar button.ghost {
      background: transparent;
      color: var(--paper);
      box-shadow: inset 0 0 0 1px currentColor;
      opacity: .8;
    }
    .bar button:hover { opacity: 1; }
    .bar button:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
    .bar select {
      font: inherit;
      color: var(--paper);
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: .45rem .5rem;
      cursor: pointer;
    }
    .bar select option { color: #111; background: #fff; }
    .bar .step {
      display: flex;
      align-items: center;
      box-shadow: inset 0 0 0 1px currentColor;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar .step button { border-radius: 0; background: transparent; color: var(--paper); box-shadow: none; padding: .5rem .7rem; }
    .bar .step output { min-width: 2.1rem; text-align: center; font-size: 12px; opacity: .85; }
    .bar .hint {
      margin-left: auto;
      opacity: .65;
      font-size: 11px;
      letter-spacing: .03em;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="bar no-print">
    <button id="print" type="button">Save as PDF</button>
    <button id="theme" class="ghost" type="button">Dark paper</button>
    <select id="font" aria-label="Typeface"></select>
    <span class="step">
      <button id="minus" type="button" aria-label="Smaller text">&minus;</button>
      <output id="size">16</output>
      <button id="plus" type="button" aria-label="Larger text">+</button>
    </span>
    <span class="hint">Print dialog &rarr; More settings: untick &ldquo;Print headers and footers&rdquo;.</span>
  </div>
  <div id="doc"></div>
  <script src="print.js"></script>
</body>
</html>
